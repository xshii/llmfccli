# config/roles.yaml - 角色配置文件
# 定义不同角色的系统提示、工具集和模型配置

# 默认角色
default_role: "programmer"

# 模型配置说明：
# - 默认使用 llm.yaml 中的全局模型
# - 如需为角色指定专用模型，取消注释 model 字段
# - 如需自定义 Modelfile，取消注释 base_model 和 modelfile 字段

# 角色定义
roles:
  # ============================================================
  # 程序员角色（默认）
  # ============================================================
  programmer:
    name: "程序员"
    name_en: "Programmer"
    description: "C/C++ 编程助手，提供代码补全、错误修复和测试生成"
    icon: "💻"

    # 角色专用模型（可选，默认使用 llm.yaml 中的全局模型）
    # model: "role-programmer:latest"
    # base_model: "qwen3:latest"
    # modelfile: "config/modelfiles/programmer.modelfile"

    # 启用的工具类别
    tool_categories:
      - filesystem
      - executor
      - git
      - agent

    # 排除的工具（可选）
    excluded_tools: []

  # ============================================================
  # 问答助手角色（纯对话，无工具）
  # ============================================================
  chat:
    name: "问答助手"
    name_en: "Chat Assistant"
    description: "通用问答助手，回答技术问题、解释概念、提供建议，不执行任何工具操作"
    icon: "💬"

    # 不启用任何工具
    tool_categories: []
    excluded_tools: []

  # ============================================================
  # 知识治理员角色
  # ============================================================
  knowledge_curator:
    name: "知识治理员"
    name_en: "Knowledge Curator"
    description: "知识结构化与分类归档专家，支持 RAG 知识库构建"
    icon: "📚"

    # 角色专用模型（可选）
    # model: "role-knowledge-curator:latest"
    # base_model: "qwen3:latest"
    # modelfile: "config/modelfiles/knowledge-curator.modelfile"

    # 启用的工具类别（知识治理专用工具）
    tool_categories:
      - filesystem
      - knowledge

    # 额外包含的工具（跨类别复用）
    included_tools:
      - grep_search      # 复用：搜索相关内容
      - list_dir         # 复用：浏览知识库结构

    # 排除的工具
    excluded_tools:
      - bash_run
      - git
      - cmake_build
      - edit_file        # 知识治理员只读取，不直接编辑
      - create_file      # 通过 save_knowledge 工具创建

  # ============================================================
  # 文档写作者角色
  # ============================================================
  doc_writer:
    name: "文档写作者"
    name_en: "Documentation Writer"
    description: "技术文档撰写专家，生成高质量的 README、API 文档和教程"
    icon: "📝"

    # 角色专用模型（可选）
    # model: "role-doc-writer:latest"
    # base_model: "qwen3:latest"
    # modelfile: "config/modelfiles/doc-writer.modelfile"

    tool_categories:
      - filesystem

    excluded_tools:
      - bash_run
      - cmake_build

  # ============================================================
  # 代码审查者角色
  # ============================================================
  code_reviewer:
    name: "代码审查者"
    name_en: "Code Reviewer"
    description: "专注于代码质量、安全性和最佳实践的审查专家"
    icon: "🔍"

    # 角色专用模型（可选）
    # model: "role-code-reviewer:latest"
    # base_model: "qwen3:latest"
    # modelfile: "config/modelfiles/code-reviewer.modelfile"

    tool_categories:
      - filesystem
      - git

    excluded_tools:
      - bash_run
      - create_file
      - edit_file

# ============================================================
# 知识分类体系（供知识治理员使用）
# ============================================================
knowledge_taxonomy:
  # 一级分类
  categories:
    - name: "编程语言"
      subcategories:
        - "C/C++"
        - "Python"
        - "Rust"
        - "Go"
        - "JavaScript"
        - "其他语言"

    - name: "软件工程"
      subcategories:
        - "设计模式"
        - "架构设计"
        - "测试方法"
        - "重构技术"
        - "代码规范"

    - name: "工具与框架"
      subcategories:
        - "构建工具"
        - "版本控制"
        - "CI/CD"
        - "容器化"
        - "IDE 与编辑器"

    - name: "系统与网络"
      subcategories:
        - "操作系统"
        - "网络协议"
        - "分布式系统"
        - "数据库"
        - "安全"

    - name: "AI 与机器学习"
      subcategories:
        - "深度学习"
        - "自然语言处理"
        - "计算机视觉"
        - "强化学习"
        - "MLOps"

# ============================================================
# 知识输出格式配置
# ============================================================
knowledge_output:
  # 摘要配置
  summary:
    min_length: 100
    max_length: 300
    format: "paragraph"  # paragraph | bullet_points

  # 关键词配置
  keywords:
    min_count: 5
    max_count: 10
    include_weight: true  # 是否包含关键词权重

  # 分类配置
  classification:
    max_depth: 3  # 最大分类层级
    allow_multiple: true  # 允许多分类

  # 关联配置
  relations:
    types:
      - "related_to"      # 相关
      - "depends_on"      # 依赖
      - "extends"         # 扩展
      - "implements"      # 实现
      - "contradicts"     # 矛盾
