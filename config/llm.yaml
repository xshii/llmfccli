# config/llm.yaml - LLM 配置
# 支持 Ollama 和 OpenAI 兼容 API

default_backend: "ollama"  # 可选: ollama, openai

# ============================================================
# Ollama 后端配置
# ============================================================
ollama:
  enabled: true
  base_url: "http://localhost:11434"
  model: "qwen3-coder:latest"  # 全局模型，所有任务使用
  timeout: 300
  stream: true
  think: true  # 启用思考模式

  # 按角色覆盖模型（可选，取消注释启用）
  # models:
  #   compress: "qwen3:latest"  # 上下文压缩用更快的模型
  #   intent: "qwen3:latest"    # 意图识别用更快的模型

  retry:
    max_attempts: 3
    backoff_factor: 2
    initial_delay: 1

# ============================================================
# OpenAI 兼容后端配置
# ============================================================
openai:
  enabled: false
  base_url: "https://api.openai.com/v1"
  api_key: "${OPENAI_API_KEY}"  # 支持环境变量引用
  model: "gpt-4-turbo"  # 全局模型
  timeout: 300
  stream: true
  native_tool_calling: true

  # 按角色覆盖模型（可选）
  # models:
  #   compress: "gpt-3.5-turbo"
  #   intent: "gpt-3.5-turbo"

  generation:
    temperature: 0.1
    top_p: 0.9
    max_tokens: 4096

  retry:
    max_attempts: 3
    backoff_factor: 2
    initial_delay: 1

# ============================================================
# SSH 隧道配置（仅 Ollama 远程部署需要）
# ============================================================
ssh:
  enabled: true
  host: "ciserver"
  extra_paths:
    - "/opt/homebrew/bin"
    - "/usr/local/bin"

# ============================================================
# 模型管理配置（仅 Ollama）
# ============================================================
model_management:
  models:
    - name: "claude-qwen:latest"
      base_model: "qwen3-coder:latest"
      modelfile: "modelfiles/claude-qwen.modelfile"
      description: "C++ 编程助手，基于 Qwen3"
      enabled: true

  base_models:
    - registry_name: "qwen3-coder:latest"
      local_name: "qwen3-coder:latest"
      auto_pull: true
